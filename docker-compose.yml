version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptopos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypto_pos
      POSTGRES_USER: cryptopos
      POSTGRES_PASSWORD: cryptopos_password
    ports:
      - "5433:5432"
    volumes:
      - cryptopos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptopos -d crypto_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cryptopos_pgdata:
    name: cryptopos_pgdata
